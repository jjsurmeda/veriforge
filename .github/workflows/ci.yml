name: ci

on:
  push:
    branches: [main]
  # So a branch can be verified before it is merged — CLAUDE.md requires the
  # eval gate on graph/prompt changes, and that has to be checkable on the
  # branch, not only after the merge to main.
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        # ParadeDB ships pgvector + pg_search; retrieval tests (slice 3,
        # TRD §9.2) need the BM25 index from pg_search.
        image: paradedb/paradedb:0.25.9-pg16
        env:
          POSTGRES_USER: veriforge
          POSTGRES_PASSWORD: veriforge
          POSTGRES_DB: veriforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriforge -d veriforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      # The committed openapi.json must match the schema the app serves —
      # this fails the build when a schema change forgets to regenerate.
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code ../web/openapi.json

  eval-gate:
    # TRD §15: 20-item fast subset on every push to main that touches
    # graph, retrieval, decisions or prompts. Skips cleanly when the
    # OpenRouter secret is absent (forks) or no baseline exists yet.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    services:
      postgres:
        image: paradedb/paradedb:0.25.9-pg16
        env:
          POSTGRES_USER: veriforge
          POSTGRES_PASSWORD: veriforge
          POSTGRES_DB: veriforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriforge -d veriforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow one. The scope check diffs the branch
          # against its merge-base with main, and neither a depth-1 clone (no
          # parent, so `git diff` printed "unknown revision" and the `!` read
          # that failure as "no gated paths changed") nor a depth-2 clone (the
          # base commit absent, so the merge-base cannot be computed) can
          # answer the question. Both failures skipped the gate and reported a
          # green job on a branch that changed ten files under graph/,
          # retrieval/ and decisions/. See KI-6: reading a green eval-gate job
          # that never called OpenRouter as a pass is how the baseline went
          # unrecorded for three runs.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check whether the gate applies to this push
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # The decision lives in scripts/eval_gate_scope.sh, not here, because
          # a bug in this step cannot report itself: a scope check that wrongly
          # says "applies=false" produces a green eval-gate job that measured
          # nothing, which is indistinguishable from a pass. D6 fixed this step
          # twice and D7 changed it a third time, with no test each time.
          # tests/evals/test_gate_scope.py runs the same script against a
          # temporary git repository.
          set -euo pipefail
          scope_out=$(../../scripts/eval_gate_scope.sh \
            "$EVENT_NAME" "$BEFORE_SHA" "$HEAD_SHA")
          echo "$scope_out"
          echo "$scope_out" >> "$GITHUB_OUTPUT"
          # The one input the script cannot see: whether a provider key exists.
          # A duplicate key in $GITHUB_OUTPUT takes its last value, so writing
          # `reason` again here is what makes the secret missing reported as
          # unverified rather than as a silent skip. `applies` stays true, so
          # the job still does not claim to have passed.
          if printf '%s' "$scope_out" | grep -q '^applies=true$' \
            && [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "reason=the OPENROUTER_API_KEY secret is not set (owner action O1); nothing was measured" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: uv sync --frozen
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge uv run alembic upgrade head
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge uv run python -m evals.loader
      - name: Eval gate (TRD §15 fast20 vs the stored baseline)
        id: gate
        if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: |
          set -o pipefail
          # Before the tee, not after: `tee` opens its file when the pipeline
          # starts, and `.data/evals` is created by `evals.baseline.record`
          # *inside* the gate — i.e. six minutes later. Without this, tee exits
          # non-zero on a missing directory and pipefail turns a *passing* gate
          # into a failed step. Found on CI run 36982769288: the gate passed at
          # 0.96042 and the job still went red.
          mkdir -p .data/evals
          DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge \
            uv run python -m evals.gate 2>&1 | tee .data/evals/gate.log
      # The per-item export (answers, claims with their verdicts, the retrieved
      # contexts, `stage_ms`) has to be read back out of eval_results while the
      # database still exists, and it runs even when the gate failed — a failing
      # run is exactly when the breakdown matters, and it is the only thing that
      # can say WHICH items moved rather than only that the number did.
      #
      # `always()` is load-bearing here, and not as a nicety. A step whose `if:`
      # contains no status check function inherits `success()` from the step
      # before it, so `if: steps.scope.outputs.applies == 'true'` is really
      # "if the gate passed AND the scope check said yes". On CI run
      # 36982769288 the gate failed and this step was skipped without running —
      # the export missing on exactly the run it exists for, and the artifact
      # uploaded with one 621-byte summary in it.
      #
      # KI-42 is the cost of not having it: CI scored 0.90833 against a 0.97556
      # local baseline and nothing on the run could say whether that was the tail
      # of the distribution or a different distribution, because the claims and
      # verdicts were discarded with the runner. The same blindness cost D3, D4,
      # D5 and D7 a CI run each — the question could be re-argued but never
      # decomposed.
      - name: Per-item export (answers, claims, verdicts, stage_ms)
        if: always() && steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: |
          set -euo pipefail
          mkdir -p .data/evals
          DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge \
            uv run python scripts/eval_dump_stages.py
      - name: Report the eval gate outcome
        if: always()
        run: |
          {
            echo "### eval gate"
            echo ""
            if [ -n "${{ steps.scope.outputs.reason }}" ]; then
              echo "**eval gate SKIPPED:** ${{ steps.scope.outputs.reason }}"
              echo ""
              echo "The TRD §15 fast20 gate is **unverified** on this push. This is not a pass."
            else
              echo "**eval gate RAN** and exited \`${{ steps.gate.outcome }}\` on \`$(git rev-parse HEAD)\`."
              echo ""
              echo "Baseline: \`evals/seed/baseline_fast20.json\`. The comparison is meaningless if the"
              echo "models differ, and \`evals.gate\` now refuses that case rather than comparing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The evidence is kept, whether the gate passed or failed, so a red run can
      # be diagnosed from the run page instead of re-run locally. `always()` is
      # the whole point: a gate that fails is the case worth keeping evidence
      # for. `if-no-files-found: error` rather than `warn`, because an artifact
      # step that silently uploads nothing would recreate KI-42 — a green upload
      # that means there is nothing in it.
      - name: Upload the eval gate evidence
        if: always() && steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-evidence
          path: |
            .data/evals/*.json
            .data/evals/gate.log
          if-no-files-found: error
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # oxlint, rolldown, @tailwindcss/oxide and lightningcss each ship a
      # native binary as per-platform optional deps, and a lockfile generated
      # on one machine records only that machine's (npm/cli#4828). Without the
      # Linux bindings `npm run lint` and `npm run build` die with "Cannot find
      # native binding". Fail here, with the reason, instead.
      - name: Check the native bindings are resolvable on Linux
        run: node ../../scripts/patch-native-lock.mjs --check
      # check-colors.sh searches with ripgrep, which the ubuntu runner image
      # does not ship. Without this the script's `rg` calls exit 127, which
      # its `if ! rg -q` reads as "contract absent" — so a missing tool
      # reported itself as a tokens.css violation. It was masked until the
      # oxlint fix let this job get past `npm ci`.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run codegen:ci
      - run: npm run lint
      - run: ../../scripts/check-colors.sh
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
