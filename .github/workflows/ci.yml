name: ci

on:
  push:
    branches: [main]
  # So a branch can be verified before it is merged — CLAUDE.md requires the
  # eval gate on graph/prompt changes, and that has to be checkable on the
  # branch, not only after the merge to main.
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        # ParadeDB ships pgvector + pg_search; retrieval tests (slice 3,
        # TRD §9.2) need the BM25 index from pg_search.
        image: paradedb/paradedb:0.25.9-pg16
        env:
          POSTGRES_USER: veriforge
          POSTGRES_PASSWORD: veriforge
          POSTGRES_DB: veriforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriforge -d veriforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      # The committed openapi.json must match the schema the app serves —
      # this fails the build when a schema change forgets to regenerate.
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code ../web/openapi.json

  eval-gate:
    # TRD §15: 20-item fast subset on every push to main that touches
    # graph, retrieval, decisions or prompts. Skips cleanly when the
    # OpenRouter secret is absent (forks) or no baseline exists yet.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    services:
      postgres:
        image: paradedb/paradedb:0.25.9-pg16
        env:
          POSTGRES_USER: veriforge
          POSTGRES_PASSWORD: veriforge
          POSTGRES_DB: veriforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veriforge -d veriforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check whether the gate applies to this push
        id: scope
        run: |
          # `reason` is empty only when the gate will really run. A skip is
          # reported with its cause instead of passing silently: a green
          # eval-gate job that never called OpenRouter is not evidence that
          # the gate passed, and reading it as one is how the baseline went
          # unrecorded for three runs (KI-6).
          if ! git diff --name-only HEAD~1 HEAD | grep -Eq '^(apps/api/(graph|retrieval|decisions|prompts)/)'; then
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "reason=no graph/retrieval/decisions/prompts change in this push" >> "$GITHUB_OUTPUT"
          elif [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "reason=the OPENROUTER_API_KEY secret is not set (owner action O1); nothing was measured" >> "$GITHUB_OUTPUT"
          else
            echo "applies=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: uv sync --frozen
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge uv run alembic upgrade head
      - if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge uv run python -m evals.loader
      - name: Eval gate (TRD §15 fast20 vs the stored baseline)
        id: gate
        if: steps.scope.outputs.applies == 'true' && env.OPENROUTER_API_KEY != ''
        run: DATABASE_URL=postgresql+asyncpg://veriforge:veriforge@localhost:5432/veriforge uv run python -m evals.gate
      - name: Report the eval gate outcome
        if: always()
        run: |
          {
            echo "### eval gate"
            echo ""
            if [ -n "${{ steps.scope.outputs.reason }}" ]; then
              echo "**eval gate SKIPPED:** ${{ steps.scope.outputs.reason }}"
              echo ""
              echo "The TRD §15 fast20 gate is **unverified** on this push. This is not a pass."
            else
              echo "**eval gate RAN** and exited \`${{ steps.gate.outcome }}\` on \`$(git rev-parse HEAD)\`."
              echo ""
              echo "Baseline: \`evals/seed/baseline_fast20.json\`. The comparison is meaningless if the"
              echo "models differ, and \`evals.gate\` now refuses that case rather than comparing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # oxlint's native linter ships as 18 platform-specific optional deps,
      # and a lockfile generated on one machine only records that machine's
      # (npm/cli#4828). Without the Linux binding `npm run lint` dies with
      # "Cannot find native binding". Fail here, with the reason, instead.
      - name: Check the oxlint native binding is resolvable on Linux
        run: node ../../scripts/patch-oxlint-lock.mjs --check
      - run: npm ci
      - run: npm run codegen:ci
      - run: npm run lint
      - run: ../../scripts/check-colors.sh
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
